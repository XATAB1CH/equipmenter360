name: montazh360

services:
  # PostgreSQL — хранилище нарядов.
  db:
    image: postgres:16-alpine
    container_name: montazh360-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-montazh}
      POSTGRES_PASSWORD: montazh
      POSTGRES_DB: ${DB_NAME:-montazh360}
    ports:
      # Наружу — 5433, чтобы не конфликтовать с локальным Postgres на 5432.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-montazh} -d $${POSTGRES_DB:-montazh360}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Приложение: Go-бэкенд отдаёт и JSON API, и собранный фронт (единый порт 8080).
  # Сначала собирается стейдж `frontend` из Frontend/Dockerfile, затем Backend/Dockerfile
  # ссылается на него через `FROM frontend` (target).
  frontend-build:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: frontend
    image: montazh360-frontend-build
    # Не запускается как сервис — только build-стейдж для app (нет ports/depends_on для запуска).

  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      additional_contexts:
        # FROM frontend в Backend/Dockerfile резолвится в собранный образ стейджа.
        frontend: docker-image://montazh360-frontend-build
    container_name: montazh360-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Переопределяет config.docker.yaml — БД по имени сервиса.
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-montazh}
      DB_PASSWORD: montazh
      DB_NAME: ${DB_NAME:-montazh360}
    ports:
      - "8080:8080"
    networks:
      - internal

networks:
  internal:
    name: montazh360-internal

volumes:
  db-data:
