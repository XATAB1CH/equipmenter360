openapi: 3.0.3
info:
  title: Монтаж 360 API
  version: 0.1.0
  description: |
    JSON API системы управления нарядами для монтажных бригад «Монтаж 360».

    Сервер отдаёт и этот API (префикс `/api`), и собранный фронтенд (все остальные пути).
    В dev-режиме фронт проксирует `/api` на этот сервер (порт 8080).
servers:
  - url: /api
tags:
  - name: orders
    description: Наряды на монтажные работы
  - name: meta
    description: Справочники для выпадающих списков
  - name: system
    description: Служебные ручки

paths:
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Список нарядов
      description: Возвращает все наряды, новые сверху (по убыванию номера).
      responses:
        '200':
          description: Список нарядов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrder'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Создать наряд
      description: |
        Создаёт наряд. Сервер сам проставляет `id` (следующий номер), `status = created`,
        `executor = null` и `date` (текущая дата создания) — эти поля в запросе не передаются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Созданный наряд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequest'

  /orders/{id}:
    patch:
      tags: [orders]
      operationId: updateOrder
      summary: Обновить наряд
      description: |
        Частичное обновление: назначение/снятие исполнителя и смена статуса.

        Бизнес-правила (применяются на сервере):
        - передан непустой `executor` → статус становится `assigned`;
        - передан `executor: null` → исполнитель снимается, статус становится `created`;
        - `status: cancelled` можно выставить из любого статуса.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Обновлённый наряд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Справочники
      description: Справочники типов работ и монтажников для выпадающих списков.
      responses:
        '200':
          description: Справочники
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'

  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Проверка живости
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Номер наряда
      schema:
        type: string
        example: '00142'

  responses:
    BadRequest:
      description: Ошибка валидации запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Наряд не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Status:
      type: string
      description: Статус наряда
      enum: [created, assigned, inwork, done, cancelled]

    WorkOrder:
      type: object
      description: Наряд на монтажные работы
      required: [id, address, workType, client, phone, executor, date, status, comment]
      properties:
        id:
          type: string
          description: Номер наряда (zero-padded, 5 знаков)
          example: '00142'
        address:
          type: string
          example: 'ул. Ленина, д. 42, кв. 18'
        workType:
          type: string
          example: 'Подключение абонента'
        client:
          type: string
          description: ФИО клиента или название организации
          example: 'Смирнов Игорь Алексеевич'
        phone:
          type: string
          example: '+7 900 123-45-67'
        executor:
          type: string
          nullable: true
          description: ФИО монтажника или null, если не назначен
          example: 'Иванов А.С.'
        date:
          type: string
          format: date
          description: Дата создания наряда
          example: '2026-09-22'
        status:
          $ref: '#/components/schemas/Status'
        comment:
          type: string
          example: 'Клиент просит позвонить за час'

    OrderCreate:
      type: object
      description: Данные для создания наряда (id/status/executor/date проставляет сервер)
      required: [address, workType, client, phone]
      properties:
        address:
          type: string
          minLength: 1
          example: 'ул. Ленина, д. 42, кв. 18'
        workType:
          type: string
          minLength: 1
          example: 'Подключение абонента'
        client:
          type: string
          minLength: 1
          example: 'Смирнов Игорь Алексеевич'
        phone:
          type: string
          minLength: 1
          example: '+7 900 123-45-67'
        comment:
          type: string
          example: 'Домофон не работает'

    OrderUpdate:
      type: object
      description: |
        Частичное обновление наряда. Поля независимы; чтобы снять исполнителя,
        передайте `executor: null` явно. Отсутствующие поля не меняются.
      properties:
        executor:
          type: string
          nullable: true
          description: ФИО монтажника; null — снять исполнителя
          example: 'Петров Д.Н.'
        status:
          $ref: '#/components/schemas/Status'

    Meta:
      type: object
      description: Справочники для выпадающих списков
      required: [workTypes, technicians]
      properties:
        workTypes:
          type: array
          items:
            type: string
          example: ['Монтаж кабеля', 'Замена оборудования', 'Диагностика']
        technicians:
          type: array
          items:
            type: string
          example: ['Иванов А.С.', 'Петров Д.Н.']

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Человекочитаемое описание ошибки
          example: 'поле address обязательно'
