openapi: 3.0.3
info:
  title: Монтаж 360 API
  version: 0.2.0
  description: |
    JSON API системы управления нарядами «Монтаж 360».

    **Аутентификация.** Все ручки, кроме `/api/healthz` и `/api/auth/login`, требуют JWT:
    заголовок `Authorization: Bearer <token>`. Токен выдаёт `POST /api/auth/login`.

    **Роли.**
    - `dispatcher` — полный доступ (управление нарядами и монтажниками);
    - `montazhnik` — видит только свои наряды, может менять их статус.
servers:
  - url: /api
tags:
  - name: auth
    description: Аутентификация и текущий пользователь
  - name: orders
    description: Наряды на монтажные работы
  - name: technicians
    description: Монтажники (CRUD)
  - name: reports
    description: Отчёты
  - name: meta
    description: Справочники
  - name: system
    description: Служебные ручки

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход (выдача JWT)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Токен и пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Текущий пользователь
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Список нарядов
      description: Диспетчер видит все, монтажник — только свои. Новые сверху.
      responses:
        '200':
          description: Список нарядов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Создать наряд (только диспетчер)
      description: Сервер проставляет `id`, `status = created`, `executor = null` и `date`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Созданный наряд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{id}:
    patch:
      tags: [orders]
      operationId: updateOrder
      summary: Обновить наряд
      description: |
        Назначение/снятие исполнителя (только диспетчер) и смена статуса
        (монтажник — только для своих нарядов).
        - передан непустой `executorId` → статус `assigned`;
        - передан `executorId: null` → исполнитель снят, статус `created`.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Обновлённый наряд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /technicians:
    get:
      tags: [technicians]
      operationId: listTechnicians
      summary: Список монтажников
      parameters:
        - name: active
          in: query
          description: 'active=true — только действующие (для селектов)'
          schema:
            type: boolean
      responses:
        '200':
          description: Список монтажников
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Technician'
    post:
      tags: [technicians]
      operationId: createTechnician
      summary: Создать монтажника (только диспетчер)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianCreate'
      responses:
        '201':
          description: Созданный монтажник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Technician'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /technicians/{id}:
    put:
      tags: [technicians]
      operationId: updateTechnician
      summary: Обновить монтажника (только диспетчер)
      parameters:
        - $ref: '#/components/parameters/TechnicianId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianUpdate'
      responses:
        '200':
          description: Обновлённый монтажник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Technician'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [technicians]
      operationId: deleteTechnician
      summary: Удалить монтажника (только диспетчер)
      description: Нельзя удалить монтажника, у которого есть наряды (409).
      parameters:
        - $ref: '#/components/parameters/TechnicianId'
      responses:
        '204':
          description: Удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /reports/summary:
    get:
      tags: [reports]
      operationId: reportSummary
      summary: Сводный отчёт за период
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-09-01'
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-09-30'
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Справочники
      responses:
        '200':
          description: Справочники
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'

  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Проверка живости
      security: []
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Номер наряда
      schema:
        type: string
        example: '00142'
    TechnicianId:
      name: id
      in: path
      required: true
      description: ID монтажника
      schema:
        type: integer
        example: 4

  responses:
    BadRequest:
      description: Ошибка валидации запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Нет прав на операцию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт (например, удаление монтажника с нарядами)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Status:
      type: string
      enum: [created, assigned, inwork, done, cancelled]

    Role:
      type: string
      enum: [dispatcher, montazhnik]

    Credentials:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: dispatcher
        password:
          type: string
          example: password

    User:
      type: object
      properties:
        id:
          type: integer
        login:
          type: string
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        technicianId:
          type: integer
          nullable: true

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    WorkOrder:
      type: object
      required: [id, address, workType, client, phone, executor, date, status, comment]
      properties:
        id:
          type: string
          example: '00142'
        address:
          type: string
        workType:
          type: string
        client:
          type: string
        phone:
          type: string
        executor:
          type: string
          nullable: true
          description: ФИО монтажника (null — не назначен)
        executorId:
          type: integer
          nullable: true
          description: ID монтажника
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/Status'
        comment:
          type: string

    OrderCreate:
      type: object
      required: [address, workType, client, phone]
      properties:
        address:
          type: string
        workType:
          type: string
        client:
          type: string
        phone:
          type: string
        comment:
          type: string

    OrderUpdate:
      type: object
      properties:
        executorId:
          type: integer
          nullable: true
          description: ID монтажника; null — снять исполнителя
        status:
          $ref: '#/components/schemas/Status'

    Technician:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        phone:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date

    TechnicianCreate:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
        phone:
          type: string

    TechnicianUpdate:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        active:
          type: boolean

    Meta:
      type: object
      properties:
        workTypes:
          type: array
          items:
            type: string

    ReportSummary:
      type: object
      properties:
        total:
          type: integer
        done:
          type: integer
        inwork:
          type: integer
        cancelled:
          type: integer
        created:
          type: integer
        assigned:
          type: integer
        byTechnician:
          type: array
          items:
            $ref: '#/components/schemas/TechLoad'

    TechLoad:
      type: object
      properties:
        technicianId:
          type: integer
        fullName:
          type: string
        total:
          type: integer
        done:
          type: integer
        inwork:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

security:
  - bearerAuth: []
